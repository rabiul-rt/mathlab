<script>
// ================= Mini Wolfram-language interpreter =================
const CONST={Pi:Math.PI,E:Math.E,True:true,False:false,Red:'red',Green:'green',Blue:'blue',Black:'black',Orange:'orange',Bold:'Bold',Infinity:Infinity};
let V={},F={},out=[],dec=false,SL=null,oc=0;
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const num=x=>typeof x=='number',isP=a=>!!a&&typeof a=='object'&&!Array.isArray(a)&&a.t!==undefined;
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
// ---- polynomials (multivariate, numeric coefficients) ----
const ky=e=>Object.keys(e).sort().map(k=>k+'^'+e[k]).join(' ');

const toP=a=>a===0?{t:{}}:isP(a)?a:{t:{'':[a,{}]}};
function norm(p){const t={};let n=0,k0;for(const k in p.t){let c=p.t[k][0];if(Math.abs(c-Math.round(c))<1e-9)c=Math.round(c);if(Math.abs(c)>1e-12){t[k]=[c,p.t[k][1]];n++;k0=k}}if(!n)return 0;if(n==1&&k0==='')return t[''][0];return{t}}
const padd=(a,b)=>{const t={};for(const k in a.t)t[k]=[a.t[k][0],a.t[k][1]];for(const k in b.t)t[k]=t[k]?[t[k][0]+b.t[k][0],t[k][1]]:[b.t[k][0],b.t[k][1]];return{t}};
const pmul=(a,b)=>{const t={};for(const i in a.t)for(const j in b.t){const e={...a.t[i][1]};for(const v in b.t[j][1])e[v]=(e[v]||0)+b.t[j][1][v];const k=ky(e),c=a.t[i][0]*b.t[j][0];t[k]=t[k]?[t[k][0]+c,e]:[c,e]}return{t}};
const chk=x=>{if(!num(x)&&!isP(x))throw Error('Cannot do arithmetic with: '+fmt(x));return x};
const ad=(a,b)=>num(a)&&num(b)?a+b:norm(padd(toP(chk(a)),toP(chk(b))));
const mu=(a,b)=>num(a)&&num(b)?a*b:norm(pmul(toP(chk(a)),toP(chk(b))));
const sb=(a,b)=>ad(a,mu(-1,b));
const dv=(a,b)=>{if(num(b))return num(a)?a/b:mu(a,1/b);throw Error('Division by a symbolic expression is not supported')};
const pw=(a,b)=>{if(num(a)&&num(b))return Math.pow(a,b);if(num(b)&&Number.isInteger(b)&&b>=0){let r=1;for(let i=0;i<b;i++)r=mu(r,a);return r}throw Error('This symbolic power is not supported')};
const vn=x=>{if(isP(x)){const t=Object.values(x.t);if(t.length==1&&Object.keys(t[0][1]).length==1&&t[0][0]==1)return Object.keys(t[0][1])[0]}throw Error('Symbol expected (the variable may already have a value — use Clear)')};
const coef=(p,n,k)=>{if(num(p))return k==0?p:0;const t={};for(const key in p.t){const[c,e]=p.t[key];if((e[n]||0)==k){const e2={...e};delete e2[n];const k2=ky(e2);t[k2]=t[k2]?[t[k2][0]+c,e2]:[c,e2]}}return norm({t})};
const degOf=(p,n)=>num(p)?0:Math.max(0,...Object.values(p.t).map(t=>t[1][n]||0));
const varsOf=p=>num(p)?[]:[...new Set(Object.values(p.t).flatMap(t=>Object.keys(t[1])))].sort();
const subst=(p,n,val)=>{if(!isP(p))return p;let r=0;for(const key in p.t){const[c,e]=p.t[key];const e2={...e},k=e2[n]||0;delete e2[n];const base=Object.keys(e2).length?{t:{[ky(e2)]:[1,e2]}}:1;r=ad(r,mu(mu(c,base),pw(val,k)))}return r};
const dP=(p,n)=>{if(!isP(p))return 0;const t={};for(const key in p.t){const[c,e]=p.t[key],k=e[n]||0;if(!k)continue;const e2={...e};e2[n]=k-1;if(!e2[n])delete e2[n];const k2=ky(e2);t[k2]=t[k2]?[t[k2][0]+c*k,e2]:[c*k,e2]}return norm({t})};
const tdeg=e=>Object.values(e).reduce((s,x)=>s+x,0);
const cmpT=(a,b)=>{const da=tdeg(a[1]),db=tdeg(b[1]);if(da!=db)return da-db;const vs=[...new Set([...Object.keys(a[1]),...Object.keys(b[1])])].sort();for(const v of vs){const x=a[1][v]||0,y=b[1][v]||0;if(x!=y)return y-x}return 0};
const sortedTerms=p=>Object.values(p.t).sort(cmpT);
const cmpFac=(a,b)=>{const A=sortedTerms(a),B=sortedTerms(b);for(let i=1;i<=Math.min(A.length,B.length);i++){const x=A[A.length-i],y=B[B.length-i],c=cmpT(x,y);if(c)return c;if(x[0]!=y[0])return x[0]-y[0]}return A.length-B.length};
const SUP='⁰¹²³⁴⁵⁶⁷⁸⁹',sup=n=>String(n).replace(/\d/g,d=>SUP[d]);
function fmtP(p){if(p.f)return p.f;let s='';sortedTerms(p).forEach((t,i)=>{const[c,e]=t,mono=Object.keys(e).sort().map(k=>k+(e[k]>1?sup(e[k]):'')).join(' '),ab=Math.abs(c);let body;
if(!mono)body=fmtNum(ab);else{const cs=ab==1?'':fmtNum(ab);if(cs.includes('/')){const[n1,d1]=cs.split('/');body=(n1=='1'?mono:'('+n1+' '+mono+')')+'/'+d1}else body=(cs?cs+' ':'')+mono}
s+=i==0?(c<0?'-':'')+body:(c<0?' - ':' + ')+body});return s}
const prim=p=>{const ts=sortedTerms(p);let m=1;for(;m<1e5;m++)if(ts.every(t=>Math.abs(t[0]*m-Math.round(t[0]*m))<1e-7))break;const g=ts.map(t=>Math.abs(Math.round(t[0]*m))).reduce(gcd);const f=ts.find(t=>Object.keys(t[1]).length);return mu((f&&f[0]<0?-1:1)*m/g,p)};
// ---- factoring ----
function fUni(p,n){const d=degOf(p,n),c=[];for(let i=0;i<=d;i++)c.push(coef(p,n,i));
let m=1;for(;m<1e5;m++)if(c.every(x=>Math.abs(x*m-Math.round(x*m))<1e-7))break;
let a=c.map(x=>Math.round(x*m));const fs=new Map();
const divs=k=>{k=Math.abs(k);const r=[];for(let i=1;i*i<=k;i++)if(k%i==0){r.push(i);if(i*i!=k)r.push(k/i)}return r};
const lin=(Q,P)=>({t:P?{[ky({[n]:1})]:[Q,{[n]:1}],'':[-P,{}]}:{[ky({[n]:1})]:[Q,{[n]:1}]}});
const add=(f,e)=>{const s=fmtP(f),o=fs.get(s);if(o)o.e+=e;else fs.set(s,{f,e})};
while(a.length>1){
if(a[0]==0){add(lin(1,0),1);a=a.slice(1);continue}
let hit=null;const sc=Math.max(1,...a.map(Math.abs));
for(const P of divs(a[0])){for(const Q of divs(a[a.length-1])){for(const s of[1,-1]){const r=s*P/Q;if(Math.abs(a.reduceRight((u,x)=>u*r+x,0))<1e-9*sc){hit=[Q,s*P];break}}if(hit)break}if(hit)break}
if(!hit)break;
const[Q,P]=hit,dd=[...a].reverse(),q=[];let prev=0;for(let i=0;i<dd.length-1;i++){const qi=(dd[i]+P*prev)/Q;q.push(qi);prev=qi}
a=q.reverse().map(Math.round);add(lin(Q,P),1)}
if(a.length>1){const g=norm({t:Object.fromEntries(a.map((cc,i)=>[i?ky({[n]:i}):'',[cc,i?{[n]:i}:{}]]))});add(prim(g),1)}
return[...fs.values()]}
function fBi(p,[u,v]){if(degOf(p,v)!=2)return null;const A=coef(p,v,2),Bc=coef(p,v,1),C=coef(p,v,0);if(!num(A))return null;
const Dd=sb(mu(Bc,Bc),mu(4,mu(A,C)));if(degOf(Dd,u)>2)return null;const d2=coef(Dd,u,2),d1=coef(Dd,u,1),d0=coef(Dd,u,0);let S;
if(d2>1e-12){const s=Math.sqrt(d2),w=d1/(2*s);if(Math.abs(d0-w*w)>1e-7)return null;S=ad(mu(s,mkV(u)),w)}
else if(Math.abs(d2)<1e-12&&Math.abs(d1)<1e-12&&d0>=-1e-12)S=Math.sqrt(Math.max(d0,0));else return null;
const r1=mu(1/(2*A),ad(mu(-1,Bc),S)),r2=mu(1/(2*A),sb(mu(-1,Bc),S)),g1=prim(sb(mkV(v),r1)),g2=prim(sb(mkV(v),r2));
return fmtP(g1)==fmtP(g2)?[{f:g1,e:2}]:[{f:g1,e:1},{f:g2,e:1}]}
const prodF=fs=>fs.reduce((r,x)=>mu(r,pw(x.f,x.e)),1);
function facStr(k,fs){fs=[...fs].sort((a,b)=>cmpFac(a.f,b.f));const s=fs.map(x=>{const t=fmtP(x.f);return(Object.keys(x.f.t).length>1?'('+t+')':t)+(x.e>1?sup(x.e):'')}).join(' ');return(k==1?'':k==-1?'-':fmtNum(k)+' ')+s}
function Fac(p,fs){const pr=toP(prodF(fs)),k0=Object.keys(pr.t)[0];if(k0===undefined||!p.t[k0])return p;const k=Math.round(p.t[k0][0]/pr.t[k0][0]*1e6)/1e6;if(norm(padd(p,{t:Object.fromEntries(Object.entries(pr.t).map(([a,b])=>[a,[-k*b[0],b[1]]]))}))!==0)return p;return{t:p.t,f:facStr(k,fs)}}
function pgl(a,b,mx){const va=varsOf(a)[0]||varsOf(b)[0],M=new Map();fUni(a,va).forEach(x=>M.set(fmtP(x.f),{f:x.f,e:x.e,e2:0}));
fUni(b,va).forEach(x=>{const k=fmtP(x.f),o=M.get(k);if(o)o.e2=x.e;else M.set(k,{f:x.f,e:0,e2:x.e})});
const fs=[...M.values()].map(o=>({f:o.f,e:mx?Math.max(o.e,o.e2):Math.min(o.e,o.e2)})).filter(o=>o.e>0);const r=toP(prodF(fs));return{t:r.t,f:facStr(1,fs)}}
// ---- solving ----
function urts(e,n){const d=degOf(e,n);let r=[];if(d==2){const a=coef(e,n,2),b=coef(e,n,1),c=coef(e,n,0),D=b*b-4*a*c;if(D>=-1e-12){const s=Math.sqrt(Math.max(D,0));r=[(-b-s)/(2*a),(-b+s)/(2*a)]}}
else r=fUni(e,n).filter(f=>degOf(f.f,n)==1).map(f=>-coef(f.f,n,0)/coef(f.f,n,1));return[...new Set(r.map(x=>Math.round(x*1e10)/1e10))].sort((a,b)=>a-b)}
function solveSys(es,vs){es=es.map(norm);for(const e of es)if(num(e)&&Math.abs(e)>1e-9)return[];es=es.filter(e=>!num(e));if(!es.length)return[{}];
for(const e of es)for(const v of vs){if(degOf(e,v)==1){const a=coef(e,v,1);if(num(a)){const val=mu(-1/a,coef(e,v,0));const rest=es.filter(x=>x!==e).map(x=>subst(x,v,val));

if(es.length==1){const w=varsOf(es[0]);if(w.length==1)return urts(es[0],w[0]).map(r=>({[w[0]]:r}))}
throw Error('Solve: এই ধরনের system সমর্থিত নয়')}
function simpEq(e){const[L,R]=e.eqn,d=sb(L,R);if(!isP(d)||Object.values(d.t).some(t=>tdeg(t[1])>1))return e;const ts=sortedTerms(d);let m=1;for(;m<1e4;m++)if(ts.every(t=>Math.abs(t[0]*m-Math.round(t[0]*m))<1e-7))break;

sortedTerms(mu(s,d)).forEach(t=>{const term={t:{[ky(t[1])]:[t[0],t[1]]}};if(Object.keys(t[1]).length&&t[0]>0)l=ad(l,term);else r=ad(r,mu(-1,term))});return{eqn:[l,r]}}
// ---- booleans (symbolic) ----
const atoms=(b,s=new Set())=>{if(b&&b.bx)b.bx.slice(1).forEach(x=>atoms(x,s));else if(isP(b))s.add(vn(b));return s};
const evb=(b,as)=>b&&b.bx?({and:()=>evb(b.bx[1],as)&&evb(b.bx[2],as),or:()=>evb(b.bx[1],as)||evb(b.bx[2],as),not:()=>!evb(b.bx[1],as)})[b.bx[0]]():isP(b)?as[vn(b)]:b;

// ---- lists / linear algebra (numeric) ----
const bc=(a,b,f)=>Array.isArray(a)?(Array.isArray(b)?a.map((x,i)=>bc(x,b[i],f)):a.map(x=>bc(x,b,f))):Array.isArray(b)?b.map(y=>bc(a,y,f)):f(a,b);
const mp=(a,f)=>Array.isArray(a)?a.map(x=>mp(x,f)):f(a);
const eq=(a,b)=>Array.isArray(a)?Array.isArray(b)&&a.length==b.length&&a.every((x,i)=>eq(x,b[i])):num(a)&&num(b)?Math.abs(a-b)<=1e-9*Math.max(1,Math.abs(a)):(isP(a)||isP(b))&&(num(a)||isP(a))&&(num(b)||isP(b))?norm(padd(toP(a),toP(mu(-1,b))))===0:a&&b&&a.lg&&b.lg?a.lg.vs==b.lg.vs&&a.lg.tt==b.lg.tt:a===b;
const symb=x=>isP(x)||(x&&(x.bx||x.lg));
const cmpv=(o,a,b)=>{switch(o){case'==':case'!=':{const e=eq(a,b);if(e)return o=='==';if(o=='=='&&(symb(a)||symb(b))&&!(a&&a.lg))return{eqn:[a,b]};return o!='=='}case'<':return a<b;case'>':return a>b;case'<=':return a<=b+1e-12;case'>=':return a>=b-1e-12}};
const dot=(a,b)=>{if(!Array.isArray(a[0])){if(!Array.isArray(b[0]))return a.reduce((s,x,i)=>ad(s,mu(x,b[i])),0);return b[0].map((_,j)=>a.reduce((s,x,i)=>ad(s,mu(x,b[i][j])),0))}return a.map(r=>dot(r,b))};
const I=n=>Array.from({length:n},(_,i)=>Array.from({length:n},(_,j)=>+(i==j)));
function rref(M){M=M.map(r=>[...r]);const R=M.length,C=M[0].length,piv=[];let r=0;for(let c=0;c<C&&r<R;c++){let p=r;for(let i=r;i<R;i++)if(Math.abs(M[i][c])>Math.abs(M[p][c]))p=i;if(Math.abs(M[p][c])<1e-7)continue;[M[r],M[p]]=[M[p],M[r]];const d=M[r][c];M[r]=M[r].map(x=>x/d);for(let i=0;i<R;i++)if(i!=r){const f=M[i][c];M[i]=M[i].map((x,j)=>x-f*M[r][j])}piv.push(c);r++}return{M,piv}}
function charc(A){const n=A.length;let c=[1],M=I(n);for(let k=1;k<=n;k++){const AM=dot(A,M);c.push(-AM.reduce((s,r,i)=>s+r[i],0)/k);M=AM.map((r,i)=>r.map((x,j)=>x+(i==j?c[k]:0)))}return c}

for(let it=0;it<2000;it++)for(let i=0;i<n;i++){let p=[c[0],0];for(const k of c.slice(1)){p=mul(p,z[i]);p[0]+=k}let d=[1,0];for(let j=0;j<n;j++)if(j!=i)d=mul(d,[z[i][0]-z[j][0],z[i][1]-z[j][1]]);const q=dvv(p,d);z[i]=[z[i][0]-q[0],z[i][1]-q[1]]}

const isPr=n=>{if(n<2)return false;for(let d=2;d*d<=n;d++)if(n%d==0)return false;return true};
const fib=n=>{let a=0,b=1;for(let i=0;i<n;i++)[a,b]=[b,a+b];return a};

function svg(g){const P=g.paths,T=g.texts,xs=[],ys=[];P.forEach(p=>p.pts.forEach(q=>{xs.push(q[0]);ys.push(q[1])}));T.forEach(t=>{xs.push(t.x);ys.push(t.y)});if(g.box){xs.push(g.box[0],g.box[1]);ys.push(g.box[2],g.box[3])}if(!xs.length)return'(empty graphic)';
let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);const px=(x1-x0||1)*.08,py=(y1-y0||1)*.1;x0-=px;x1+=px;y0-=py;y1+=py;
const W=400,Hh=280,m=30,X=x=>m+(x-x0)/(x1-x0)*(W-2*m),Y=y=>Hh-m-(y-y0)/(y1-y0)*(Hh-2*m);let s=`<svg viewBox="0 0 ${W} ${Hh}" class="pl">`;
if(x0<0&&x1>0)s+=`<line class="ax" x1="${X(0)}" y1="6" x2="${X(0)}" y2="${Hh-6}"/>`;if(y0<0&&y1>0)s+=`<line class="ax" x1="6" y1="${Y(0)}" x2="${W-6}" y2="${Y(0)}"/>`;
for(let k=0;k<5;k++){const xv=x0+(x1-x0)*(k+.5)/5,yv=y0+(y1-y0)*(k+.5)/5;s+=`<text x="${X(xv)}" y="${Hh-m+12}" text-anchor="middle">${+xv.toPrecision(2)}</text><text x="${m-4}" y="${Y(yv)+3}" text-anchor="end">${+yv.toPrecision(2)}</text>`}
P.forEach(p=>s+=`<polyline fill="none" style="stroke:${p.c}" stroke-width="${p.w}" ${p.d?'stroke-dasharray="6 5"':''} stroke-linejoin="round" points="${p.pts.map(q=>X(q[0]).toFixed(1)+','+Y(q[1]).toFixed(1)).join(' ')}"/>`);
T.forEach(t=>{const o=t.o||[0,0],an=o[0]<-.5?'start':o[0]>.5?'end':'middle',dx=o[0]<-.5?5:o[0]>.5?-5:0,dy=o[1]<-.5?-7:o[1]>.5?14:3;s+=`<text class="tx" x="${X(t.x)+dx}" y="${Y(t.y)+dy}" text-anchor="${an}">${esc(t.s)}</text>`});return s+'</svg>'}
function render(v){if(v&&v.g)return svg(v.g);if(v&&v.tf){const rows=v.tf.map(r=>Array.isArray(r)?r:[r]);return'<table class="tf">'+rows.map(r=>'<tr>'+r.map(c=>`<td>${esc(fmt(c,dec))}</td>`).join('')+'</tr>').join('')+'</table>'}return'<pre>'+esc(fmt(v,dec))+'</pre>'}
function stmts(src){src=src.replace(/\(\*[\s\S]*?\*\)/g,'').replace(/^\s*In\[\d*\]:=\s*/gm,'');const r=[];let d=0,cur='',q=false;
for(const ch of src+'\n'){if(ch=='"')q=!q;if(!q){if('([{'.includes(ch))d++;if(')]}'.includes(ch))d--}
if(ch=='\n'&&d<=0&&!q){const t=cur.trim();if(t&&!/(&&|\|\||[-+*\/^=,<>.])$/.test(t)){r.push(t);cur=''}else cur+=' '}else cur+=ch}return r}
function runCode(code){out=[];for(const s of stmts(code)){dec=false;try{const v=ev(parse(s));if(!/;\s*$/.test(s)&&v!==null&&v!==undefined)out.push(`<div class="lb">Out[${++oc}]=</div>`+render(v))}catch(e){out.push(`<pre class="err">⚠ ${esc(e.message)}\n   → ${esc(s.slice(0,80))}</pre>`)}}return out}
